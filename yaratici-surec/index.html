<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <title data-i18n="title.process">Yaratıcı Süreç — Zenilayda</title>
  <link rel="stylesheet" href="/src/pages.css" />
</head>
<body class="process-page">
  <header class="site-header site-header--ghost">
    <a class="brand" href="/" lang="tr">Zenilayda</a>
    <div class="header__right">
      <nav class="site-nav">
        <a href="/calismalar/" data-i18n="nav.works">Çalışmalar</a>
        <a href="/yaratici-surec/" aria-current="page" data-i18n="nav.process">Yaratıcı Süreç</a>
        <a href="/hakkinda/" data-i18n="nav.about">Hakkında</a>
        <a href="/iletisim/" data-i18n="nav.contact">İletişim</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-opt" data-lang="tr">TR</button>
        <span class="lang-sep" aria-hidden="true">|</span>
        <button type="button" class="lang-opt" data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <!-- Yatay slayt: PDF'in her sayfası tek tek gösterilir (src/surec.js) -->
  <main class="process" id="process">
    <button class="process__arrow process__arrow--prev" id="p-prev" type="button" aria-label="Önceki">&#8249;</button>

    <figure class="process__stage" id="p-stage">
      <img class="process__img" id="p-img" alt="" width="2153" height="1238" decoding="async" fetchpriority="high" />
    </figure>

    <button class="process__arrow process__arrow--next" id="p-next" type="button" aria-label="Sonraki">&#8250;</button>

    <div class="process__meta" aria-hidden="true">
      <div class="process__bar"><span id="p-bar"></span></div>
      <div class="process__progress" id="p-progress">01 / 22</div>
    </div>

    <!-- Mobil: tüm sayfalar alt alta (dikey kaydırma). JS doldurur. -->
    <div class="process__scroll" id="p-scroll"></div>
  </main>

  <!-- Mobil alt sekme çubuğu -->
  <nav class="tabbar" aria-label="Sayfalar">
    <a href="/calismalar/" data-i18n="nav.works">Çalışmalar</a>
    <a href="/yaratici-surec/" aria-current="page" data-i18n="nav.processShort">Süreç</a>
    <a href="/hakkinda/" data-i18n="nav.about">Hakkında</a>
    <a href="/iletisim/" data-i18n="nav.contact">İletişim</a>
  </nav>

  <script src="/src/i18n.js"></script>
  <script src="/src/music.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="/src/spa.js"></script>
</body>
</html>
